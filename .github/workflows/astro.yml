name: Deploy DAGs to Astronomer

on:
  push:
    branches:
      - main
    paths:
      - 'dags/**'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Astronomer CLI v2
        run: |
          curl -sSfL https://raw.githubusercontent.com/astronomer/astro-cli/main/install.sh | sh
          astro version

      - name: Authenticate to Astronomer
        run: |
          astro cloud login --token ${{ secrets.ASTRONOMER_API_TOKEN }}
          astro cloud config set --name default --org-id cm976hkwu1idk01mua2xzpm0h

      - name: Setup GCP Credentials
        run: |
          echo "${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}" | base64 -d > gcp-creds.json
          export GOOGLE_APPLICATION_CREDENTIALS=gcp-creds.json

      - name: Deploy to Astronomer
        run: |
          astro deploy --workspace-id cm976hkwu1idk01mua2xzpm0h
