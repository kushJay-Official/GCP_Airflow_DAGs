name: Deploy DAGs to Astronomer

on:
  push:
    branches:
      - main
    paths:
      - 'dags/**'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Astronomer CLI
        run: |
          curl -sSL https://install.astronomer.io | sudo bash

      - name: Authenticate to Astronomer
        run: |
          astro login -t ${{ secrets.ASTRONOMER_API_TOKEN }}
          astro config set --name default --org-id cm976hkwu1idk01mua2xzpm0h

      - name: Setup GCP Credentials
        run: |
          echo "${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}" | base64 -d > gcp-creds.json
          export GOOGLE_APPLICATION_CREDENTIALS=gcp-creds.json

      - name: Deploy to Astronomer
        run: |
          astro deploy --workspace-id cm976hkwu1idk01mua2xzpm0h
